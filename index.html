<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Arcminute</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070b;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
  }

  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    background: #0c0f17;
  }

  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 14px 18px;
    font: 500 13px/1 "Geist Mono", ui-monospace, monospace;
    color: #efe9dc;
    background: linear-gradient(transparent, rgba(5, 7, 11, 0.85));
    opacity: 0;
    transition: opacity 0.2s;
  }

  body:hover .bar,
  .bar:focus-within {
    opacity: 1;
  }

  .bar button {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid #343a48;
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .bar input {
    flex: 1;
    accent-color: #ff6a1a;
  }

  .bar output {
    min-width: 9ch;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div class="bar" id="bar">
  <button id="play" type="button">Play</button>
  <button id="sound" type="button">Sound off</button>
  <input id="scrub" type="range" min="0" max="72.5" step="0.001" value="0" aria-label="Time">
  <output id="time">0.00 s</output>
</div>
<script src="src/fonts.js"></script>
<script src="src/clock.js"></script>
<script src="src/kit.js"></script>
<script src="src/optics.js"></script>
<script src="src/scene.js"></script>
<script src="src/film.js"></script>
<script src="src/sound.js"></script>
<script>
(function () {
  const FM = window.FM;
  const film = FM.film;
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const params = new URLSearchParams(location.search);
  // ?res=2 draws natively at 3840 x 2160.
  const res = Math.max(1, Number(params.get("res") || 1));
  canvas.width = film.W * res;
  canvas.height = film.H * res;
  const scratch = document.createElement("canvas");
  scratch.width = film.W * res;
  scratch.height = film.H * res;

  const rendering = navigator.webdriver || params.has("render");
  let blur = rendering && params.get("blur") !== "0";

  // Draw film time t. With motion blur, subframes of the same instant are averaged.
  function seek(t) {
    if (blur) film.drawBlurred(ctx, scratch, t, 4, res);
    else film.draw(ctx, t, res);
  }

  const ready = FM.fontsReady.then(() => document.fonts.ready);
  window.seek = seek;
  window.film = {
    duration: film.duration,
    fps: film.fps,
    ready,
    setBlur(on) { blur = on; },
  };

  if (rendering) {
    document.getElementById("bar").remove();
    ready.then(() => seek(Number(params.get("t") || 0)));
    return;
  }

  // Live preview.
  const playBtn = document.getElementById("play");
  const soundBtn = document.getElementById("sound");
  const scrub = document.getElementById("scrub");
  const out = document.getElementById("time");
  scrub.max = String(film.duration);
  let playing = !params.has("t");
  let t0 = Number(params.get("t") || 0);
  let startedAt = performance.now() - t0 * 1000;
  let audio = null;
  let source = null;
  let soundOn = false;

  function now() {
    return playing ? ((performance.now() - startedAt) / 1000) % film.duration : t0;
  }

  function startSound(t) {
    stopSound();
    if (!soundOn || !playing || !FM.sound) return;
    if (!audio) {
      audio = new AudioContext({ sampleRate: 48000 });
      const mix = FM.sound.render(48000);
      const buffer = audio.createBuffer(2, mix.L.length, 48000);
      buffer.copyToChannel(mix.L, 0);
      buffer.copyToChannel(mix.R, 1);
      audio.mix = buffer;
    }
    source = audio.createBufferSource();
    source.buffer = audio.mix;
    source.connect(audio.destination);
    source.start(0, t);
    audio.resume();
  }

  function stopSound() {
    if (source) {
      source.stop();
      source = null;
    }
  }

  function setPlaying(on) {
    const t = now();
    playing = on;
    t0 = t;
    startedAt = performance.now() - t * 1000;
    playBtn.textContent = on ? "Pause" : "Play";
    if (on) startSound(t);
    else stopSound();
  }

  playBtn.addEventListener("click", () => setPlaying(!playing));
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    if (soundOn) {
      soundBtn.textContent = "Rendering sound…";
      setTimeout(() => {
        startSound(now());
        soundBtn.textContent = "Sound on";
      }, 30);
    } else stopSound();
  });
  scrub.addEventListener("input", () => {
    t0 = Number(scrub.value);
    startedAt = performance.now() - t0 * 1000;
    if (playing) startSound(t0);
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      setPlaying(!playing);
    }
  });

  let lastSoundT = 0;
  function tick() {
    const t = now();
    if (playing && t < lastSoundT) startSound(t); // looped back to the start
    lastSoundT = t;
    seek(t);
    scrub.value = String(t);
    out.textContent = `${t.toFixed(2)} s`;
    requestAnimationFrame(tick);
  }
  playBtn.textContent = playing ? "Pause" : "Play";
  ready.then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
