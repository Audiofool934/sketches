<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laid glass</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1612;
    display: grid;
    place-items: center;
  }

  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #cbbfa6;
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
const DURATION = 12;
const W = 1920;
const H = 1080;
const COLS = 320;
const ROWS = 180;
const WALL_W = 3.56;
const WALL_H = 2;
const CAM_K = 16;
const CAM_D = 6.4;

const INK = "#1c120c";
const WHITE = "#f3eee4";
const CORAL = "#d4654a";
const TEAL = "#145e62";
const TEAL_DEEP = "#0c3c40";
const GOLD = "#e4b84a";
const GOLD_LT = "#f4d68c";
const GOLD_DK = "#b07a26";
const INDIGO = "#1a2744";
const NAVY = "#0e1a30";
const SILVER = "#d5dbe3";
const SILVER_LT = "#f7f4ee";
const QUAY = "#241c16";

const PALETTE = [
  [28, 18, 12],
  [228, 184, 74],
  [196, 146, 42],
  [244, 214, 140],
  [176, 122, 38],
  [243, 238, 228],
  [212, 101, 74],
  [20, 94, 98],
  [12, 60, 64],
  [26, 39, 68],
  [14, 26, 48],
  [213, 219, 227],
  [247, 244, 238],
  [36, 28, 22]
];

const canvas = document.getElementById("stage");

function hash(i, j) {
  let n = Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

function smoothstep(e0, e1, x) {
  const t = clamp01((x - e0) / (e1 - e0));
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Closed-form spring, velocity 0 at t = 0. At rest before t = 0.
// zeta stays under 1 for these k, d pairs.
function spring(t, from, to, k, d) {
  if (t <= 0) return from;
  const w0 = Math.sqrt(k);
  const zeta = d / (2 * w0);
  const wd = w0 * Math.sqrt(Math.max(0.0001, 1 - zeta * zeta));
  const e = Math.exp(-zeta * w0 * t);
  const x0 = from - to;
  const A = x0;
  const B = (zeta * w0 * x0) / wd;
  return to + e * (A * Math.cos(wd * t) + B * Math.sin(wd * t));
}

function cameraBlend(t) {
  const go = spring(t - 1.05, 0, 1, CAM_K, CAM_D);
  const back = spring(t - 6.35, 0, 1, CAM_K, CAM_D);
  return clamp01(go * (1 - back));
}

function poly(ctx, pts, width, color) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color;
  ctx.stroke();
}

function ribbon(ctx, pts, widths, color) {
  const left = [];
  const right = [];
  for (let i = 0; i < pts.length; i++) {
    const prev = pts[Math.max(0, i - 1)];
    const next = pts[Math.min(pts.length - 1, i + 1)];
    let tx = next[0] - prev[0];
    let ty = next[1] - prev[1];
    const len = Math.hypot(tx, ty) || 1;
    tx /= len;
    ty /= len;
    const w = widths[i] / 2;
    left.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
    right.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
  }
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (const p of left) ctx.lineTo(p[0], p[1]);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function disk(ctx, x, y, rx, ry, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function waveTop(ctx, y) {
  ctx.beginPath();
  ctx.moveTo(0, y);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, y + Math.sin(x * 0.007) * 16 + Math.sin(x * 0.019) * 7);
  }
}

const NECK = [[900, 860], [980, 720], [1060, 540], [1125, 380], [1168, 270], [1188, 230]];
const NECK_INK = [168, 140, 112, 86, 64, 52];
const NECK_WHITE = [128, 104, 80, 58, 40, 30];

function paintHeron(ctx) {
  ctx.fillStyle = GOLD;
  ctx.fillRect(0, 0, W, H);

  waveTop(ctx, 860);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = TEAL;
  ctx.fill();
  ctx.fillStyle = TEAL_DEEP;
  ctx.fillRect(0, 1000, W, 80);
  waveTop(ctx, 860);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 26;
  ctx.stroke();

  const reeds = [[140, 480, 36], [280, 580, -24], [420, 400, 16]];
  for (const [x, h, lean] of reeds) {
    poly(ctx, [[x, 930], [x + lean, 930 - h]], 34, TEAL_DEEP);
    poly(ctx, [[x + lean, 930 - h], [x + lean + 54, 930 - h + 24]], 20, TEAL);
  }

  disk(ctx, 860, 820, 230, 140, INK);
  disk(ctx, 860, 820, 196, 110, WHITE);
  ribbon(ctx, NECK, NECK_INK, INK);
  ribbon(ctx, NECK, NECK_WHITE, WHITE);

  poly(ctx, [[1125, 175], [1040, 115]], 26, INK);
  poly(ctx, [[1125, 175], [1040, 115]], 10, WHITE);
  poly(ctx, [[1148, 168], [1088, 95]], 20, INK);
  poly(ctx, [[1148, 168], [1088, 95]], 8, WHITE);

  disk(ctx, 1210, 210, 78, 66, INK);
  disk(ctx, 1210, 210, 56, 46, WHITE);

  ctx.beginPath();
  ctx.moveTo(1255, 188);
  ctx.lineTo(1560, 214);
  ctx.lineTo(1258, 252);
  ctx.closePath();
  ctx.fillStyle = CORAL;
  ctx.fill();
  ctx.lineWidth = 18;
  ctx.strokeStyle = INK;
  ctx.stroke();
  poly(ctx, [[1280, 216], [1505, 224]], 10, INK);

  disk(ctx, 1232, 198, 18, 18, INK);
  disk(ctx, 1238, 192, 8, 8, SILVER_LT);

  poly(ctx, [[820, 940], [770, 1070]], 34, INK);
  poly(ctx, [[770, 1070], [890, 1080]], 20, INK);

  ctx.strokeStyle = INK;
  ctx.lineWidth = 18;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(790, 750 + i * 52, 86, 0.2, 2.2);
    ctx.stroke();
  }
}

function paintHarbor(ctx) {
  ctx.fillStyle = INDIGO;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = GOLD_DK;
  ctx.beginPath();
  ctx.moveTo(0, 760);
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, 760 + Math.sin(x * 0.006) * 18);
  ctx.lineTo(W, 980);
  ctx.lineTo(0, 980);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.moveTo(0, 680);
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, 680 + Math.sin(x * 0.006) * 16);
  ctx.lineTo(W, 820);
  ctx.lineTo(0, 820);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = GOLD_LT;
  ctx.beginPath();
  ctx.moveTo(0, 620);
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, 620 + Math.sin(x * 0.006) * 14);
  ctx.lineTo(W, 720);
  ctx.lineTo(0, 720);
  ctx.closePath();
  ctx.fill();

  waveTop(ctx, 900);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = NAVY;
  ctx.fill();
  waveTop(ctx, 900);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 26;
  ctx.stroke();

  disk(ctx, 1520, 200, 150, 150, INK);
  disk(ctx, 1520, 200, 126, 126, GOLD_DK);
  disk(ctx, 1520, 200, 102, 102, SILVER);

  ctx.beginPath();
  ctx.moveTo(520, 790);
  ctx.lineTo(1320, 768);
  ctx.lineTo(1200, 990);
  ctx.lineTo(640, 1010);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(565, 818);
  ctx.lineTo(1265, 798);
  ctx.lineTo(1165, 955);
  ctx.lineTo(680, 972);
  ctx.closePath();
  ctx.fillStyle = QUAY;
  ctx.fill();
  poly(ctx, [[545, 800], [1295, 778]], 22, GOLD_LT);

  poly(ctx, [[900, 830], [912, 330]], 30, INK);
  ctx.beginPath();
  ctx.moveTo(912, 370);
  ctx.quadraticCurveTo(1400, 520, 970, 820);
  ctx.lineTo(912, 820);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(912, 398);
  ctx.quadraticCurveTo(1335, 530, 958, 792);
  ctx.lineTo(912, 792);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.lineWidth = 20;
  ctx.strokeStyle = INK;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(912, 300);
  ctx.lineTo(1100, 365);
  ctx.lineTo(912, 418);
  ctx.closePath();
  ctx.fillStyle = CORAL;
  ctx.fill();
  ctx.lineWidth = 14;
  ctx.strokeStyle = INK;
  ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const w = 180 - i * 28;
    ctx.fillStyle = i % 2 ? SILVER_LT : SILVER;
    ctx.fillRect(1520 - w / 2, 940 + i * 28, w, 14);
  }
}

function paintPlaster() {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const n = hash(x, y);
      const b = hash(x >> 4, y >> 4);
      const i = (y * W + x) * 4;
      d[i] = 112 + b * 30 + n * 14;
      d[i + 1] = 96 + b * 24 + n * 10;
      d[i + 2] = 72 + b * 16 + n * 8;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function paintPicture(draw) {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  draw(ctx);
  return ctx.getImageData(0, 0, W, H).data;
}

function nearest(r, g, b) {
  let best = 0;
  let score = 1e12;
  for (let i = 0; i < PALETTE.length; i++) {
    const p = PALETTE[i];
    const d = (r - p[0]) * (r - p[0]) + (g - p[1]) * (g - p[1]) + (b - p[2]) * (b - p[2]);
    if (d < score) {
      score = d;
      best = i;
    }
  }
  return best;
}

function majority(data, u, v) {
  const cx = u * W;
  const cy = v * H;
  const counts = new Uint16Array(PALETTE.length);
  for (let oy = -2; oy <= 2; oy++) {
    for (let ox = -2; ox <= 2; ox++) {
      const x = Math.min(W - 1, Math.max(0, (cx + ox) | 0));
      const y = Math.min(H - 1, Math.max(0, (cy + oy) | 0));
      const i = (y * W + x) * 4;
      counts[nearest(data[i], data[i + 1], data[i + 2])]++;
    }
  }
  let best = 0;
  for (let i = 1; i < counts.length; i++) if (counts[i] > counts[best]) best = i;
  return PALETTE[best];
}

function vary(rgb, seed) {
  if (rgb[0] < 45 && rgb[1] < 36 && rgb[2] < 30) return rgb;
  const j = (seed - 0.5) * 26;
  const warm = (hash((seed * 997) | 0, 3) - 0.5) * 16;
  let r = rgb[0] + j + warm;
  let g = rgb[1] + j * 0.82;
  let b = rgb[2] + j * 0.28;
  const light = rgb[0] + rgb[1] + rgb[2];
  if (seed > 0.993 && light > 400) {
    r = 255;
    g = 250;
    b = 236;
  }
  return [
    Math.max(0, Math.min(255, r)),
    Math.max(0, Math.min(255, g)),
    Math.max(0, Math.min(255, b))
  ];
}

function luma(rgb) {
  return rgb[0] * 0.2126 + rgb[1] * 0.7152 + rgb[2] * 0.0722;
}

function buildTiles(dataA, dataB) {
  const count = COLS * ROWS;
  const base = new Array(count);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const u = (col + 0.5) / COLS;
      const v = (row + 0.5) / ROWS;
      const i = row * COLS + col;
      base[i] = {
        u,
        v,
        a: majority(dataA, u, v),
        b: majority(dataB, u, v)
      };
    }
  }

  const home = new Float32Array(count * 2);
  const colA = new Float32Array(count * 3);
  const colB = new Float32Array(count * 3);
  const shape = new Float32Array(count * 4);
  const rand = new Float32Array(count * 4);
  const cell = WALL_W / COLS;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const i = row * COLS + col;
      const left = base[row * COLS + Math.max(0, col - 1)];
      const right = base[row * COLS + Math.min(COLS - 1, col + 1)];
      const up = base[Math.max(0, row - 1) * COLS + col];
      const down = base[Math.min(ROWS - 1, row + 1) * COLS + col];
      const ax = luma(right.a) - luma(left.a);
      const ay = luma(down.a) - luma(up.a);
      const bx = luma(right.b) - luma(left.b);
      const by = luma(down.b) - luma(up.b);
      const edgeA = Math.min(1, Math.hypot(ax, ay) / 90);
      const edgeB = Math.min(1, Math.hypot(bx, by) / 90);
      const s0 = hash(col, row);
      const s1 = hash(col + 17, row + 9);
      const ca = vary(base[i].a, s0);
      const cb = vary(base[i].b, s1);
      const dist = Math.hypot(ca[0] - cb[0], ca[1] - cb[1], ca[2] - cb[2]) / 441;
      const lift = 0.12 + 0.88 * smoothstep(0.05, 0.22, dist);
      const jx = (hash(col + 3, row + 1) - 0.5) * cell * 0.55;
      const jy = (hash(col + 8, row + 4) - 0.5) * cell * 0.5;
      const und = Math.sin(col * 0.33) * cell * 0.16;
      const brick = (row % 2) * cell * 0.48;
      const x = (base[i].u - 0.5) * WALL_W + jx + brick;
      const y = (0.5 - base[i].v) * WALL_H + jy + und;
      const wave = Math.sin(col * 0.29) * 0.16;
      const alignA = edgeA > 0.32 ? Math.atan2(ay, ax) + Math.PI / 2 : wave + (s0 - 0.5) * 0.35;
      const alignB = edgeB > 0.32 ? Math.atan2(by, bx) + Math.PI / 2 : wave + (s1 - 0.5) * 0.35;
      const size = cell * (0.6 + 0.26 * hash(col, row + 6));
      home[i * 2] = x;
      home[i * 2 + 1] = y;
      colA.set([ca[0] / 255, ca[1] / 255, ca[2] / 255], i * 3);
      colB.set([cb[0] / 255, cb[1] / 255, cb[2] / 255], i * 3);
      shape.set([alignA, alignB, size, lift], i * 4);
      rand.set([
        (hash(col + 4, row + 13) - 0.5) * 0.55,
        (hash(col + 9, row + 2) - 0.5) * 0.55,
        s0,
        edgeA
      ], i * 4);
      rand[i * 4 + 3] = edgeA;
      shape[i * 4 + 3] = lift;
    }
  }

  const edgeB = new Float32Array(count);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const i = row * COLS + col;
      const left = base[row * COLS + Math.max(0, col - 1)];
      const right = base[row * COLS + Math.min(COLS - 1, col + 1)];
      const up = base[Math.max(0, row - 1) * COLS + col];
      const down = base[Math.min(ROWS - 1, row + 1) * COLS + col];
      const bx = luma(right.b) - luma(left.b);
      const by = luma(down.b) - luma(up.b);
      edgeB[i] = Math.min(1, Math.hypot(bx, by) / 90);
    }
  }

  return { count, home, colA, colB, shape, rand, edgeB };
}

function cubeMesh() {
  const p = [];
  const n = [];
  function face(a, b, c, d, normal) {
    const pts = [a, b, c, a, c, d];
    for (const q of pts) {
      p.push(q[0], q[1], q[2]);
      n.push(normal[0], normal[1], normal[2]);
    }
  }
  face([-0.5, -0.5, 0.5], [0.5, -0.5, 0.5], [0.5, 0.5, 0.5], [-0.5, 0.5, 0.5], [0, 0, 1]);
  face([0.5, -0.5, -0.5], [-0.5, -0.5, -0.5], [-0.5, 0.5, -0.5], [0.5, 0.5, -0.5], [0, 0, -1]);
  face([0.5, -0.5, 0.5], [0.5, -0.5, -0.5], [0.5, 0.5, -0.5], [0.5, 0.5, 0.5], [1, 0, 0]);
  face([-0.5, -0.5, -0.5], [-0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [-0.5, 0.5, -0.5], [-1, 0, 0]);
  face([-0.5, 0.5, 0.5], [0.5, 0.5, 0.5], [0.5, 0.5, -0.5], [-0.5, 0.5, -0.5], [0, 1, 0]);
  face([-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [0.5, -0.5, 0.5], [-0.5, -0.5, 0.5], [0, -1, 0]);
  return {
    pos: new Float32Array(p),
    nrm: new Float32Array(n)
  };
}

const TILE_VS = `#version 300 es
layout(location=0) in vec3 aCorner;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aHome;
layout(location=3) in vec3 aColA;
layout(location=4) in vec3 aColB;
layout(location=5) in vec4 aShape;
layout(location=6) in vec4 aRand;
layout(location=7) in float aEdgeB;

uniform mat4 uViewProj;
uniform float uTime;
uniform float uWallW;

out vec3 vN;
out vec3 vWorld;
out vec3 vCol;
out float vSpec;
out float vSeed;

float spring(float t, float fromV, float toV, float k, float damp) {
  if (t <= 0.0) return fromV;
  float w0 = sqrt(k);
  float zeta = damp / (2.0 * w0);
  float wd = w0 * sqrt(max(0.0001, 1.0 - zeta * zeta));
  float e = exp(-zeta * w0 * t);
  float x0 = fromV - toV;
  float A = x0;
  float B = (zeta * w0 * x0) / wd;
  return toV + e * (A * cos(wd * t) + B * sin(wd * t));
}

mat3 rotX(float a) {
  float c = cos(a), s = sin(a);
  return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c);
}
mat3 rotY(float a) {
  float c = cos(a), s = sin(a);
  return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c);
}
mat3 rotZ(float a) {
  float c = cos(a), s = sin(a);
  return mat3(c, s, 0.0, -s, c, 0.0, 0.0, 0.0, 1.0);
}

void main() {
  float ux = aHome.x / uWallW + 0.5;
  float seed = aRand.z;
  float delayGo = abs(ux - 0.62) * 1.15 + seed * 0.5;
  float delayBack = abs(ux - 0.74) * 1.15 + seed * 0.5;
  float go = spring(uTime - (0.22 + delayGo), 0.0, 1.0, 14.0, 5.5);
  float back = spring(uTime - (5.8 + delayBack), 0.0, 1.0, 14.0, 5.5);
  float s = go * (1.0 - back);
  float p = clamp(s, 0.0, 1.0);
  float dome = sin(p * 3.14159265);
  float liftK = aShape.w;
  float zLift = dome * (0.015 + 0.42 * liftK);
  float over = s > 1.0 ? s - 1.0 : (s < 0.0 ? -s : 0.0);
  zLift += over * 0.45;

  float edge = mix(aRand.w, aEdgeB, p);
  float e = smoothstep(0.28, 0.8, edge);
  float fieldA = 1.15 + 0.5 * abs(sin(seed * 48.0));
  float along = mix(fieldA, 2.05, e);
  float across = mix(0.72, 0.5, e);
  vec3 corner = aCorner;
  corner.x *= aShape.z * along;
  corner.y *= aShape.z * across;
  float thick = aShape.z * mix(0.55, 1.05, dome * liftK);
  corner.z = (aCorner.z + 0.5) * thick + zLift + 0.002 + seed * 0.0006;

  float spin = dome * liftK * (seed - 0.5) * 3.6;
  float rx = aRand.y * 1.15 + spin * 0.85;
  float ry = aRand.x * 1.15 + spin * 1.15;
  float rz = mix(aShape.x, aShape.y, p) + spin * 0.45;
  mat3 rot = rotZ(rz) * rotY(ry) * rotX(rx);
  float scatter = dome * liftK;
  vec3 world = rot * corner + vec3(aHome, 0.0);
  world.x += sin(seed * 91.7) * 0.22 * scatter;
  world.y += cos(seed * 47.3) * 0.15 * scatter;
  vWorld = world;
  vN = rot * aNormal;
  vec3 albedo = s < 0.5 ? aColA : aColB;
  float front = smoothstep(0.55, 0.98, aNormal.z);
  float gold = smoothstep(0.05, 0.42, albedo.r - albedo.b);
  float pale = smoothstep(0.45, 0.9, dot(albedo, vec3(0.33)));
  float specK = max(gold * 0.95, pale * 0.55);
  vSpec = specK * mix(0.12, 1.0, front);
  vCol = albedo * mix(0.4, 1.0, front);
  vSeed = seed;
  gl_Position = uViewProj * vec4(world, 1.0);
}
`;

const TILE_FS = `#version 300 es
precision highp float;
in vec3 vN;
in vec3 vWorld;
in vec3 vCol;
in float vSpec;
in float vSeed;
uniform vec3 uLight;
uniform vec3 uEye;
out vec4 fragColor;
void main() {
  vec3 n = normalize(vN);
  vec3 l = normalize(uLight);
  vec3 v = normalize(uEye - vWorld);
  vec3 h = normalize(l + v);
  float ndl = max(dot(n, l), 0.0);
  float spec = pow(max(dot(n, h), 0.0), 42.0);
  float glint = pow(max(dot(n, h), 0.0), 170.0);
  vec3 col = vCol * (0.46 + 0.78 * ndl);
  col += vec3(1.0, 0.97, 0.9) * spec * vSpec;
  col += vec3(1.0) * glint * vSpec * step(0.9, vSeed);
  fragColor = vec4(col, 1.0);
}
`;

const PLASTER_VS = `#version 300 es
layout(location=0) in vec2 aPos;
layout(location=1) in vec2 aUv;
uniform mat4 uViewProj;
out vec2 vUv;
void main() {
  vUv = aUv;
  gl_Position = uViewProj * vec4(aPos, 0.0, 1.0);
}
`;

const PLASTER_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uPlaster;
out vec4 fragColor;
void main() {
  fragColor = texture(uPlaster, vUv);
}
`;

function fail(msg) {
  const pre = document.createElement("pre");
  pre.textContent = msg;
  pre.style.cssText = "position:fixed;inset:12px;color:#1c120c;background:#f3eee4;padding:12px;overflow:auto";
  document.body.appendChild(pre);
  document.title = "ERR " + msg.split("\n")[0];
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    fail(gl.getShaderInfoLog(shader) || "shader");
    return null;
  }
  return shader;
}

function program(gl, vs, fs) {
  const p = gl.createProgram();
  const a = compile(gl, gl.VERTEX_SHADER, vs);
  const b = compile(gl, gl.FRAGMENT_SHADER, fs);
  if (!a || !b) return null;
  gl.attachShader(p, a);
  gl.attachShader(p, b);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fail(gl.getProgramInfoLog(p) || "link");
    return null;
  }
  return p;
}

function buffer(gl, data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
  return b;
}

function bindAttrib(gl, loc, buf, size, divisor) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  if (divisor) gl.vertexAttribDivisor(loc, divisor);
}

function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2);
  const nf = 1 / (near - far);
  const o = new Float32Array(16);
  o[0] = f / aspect;
  o[5] = f;
  o[10] = (far + near) * nf;
  o[11] = -1;
  o[14] = 2 * far * near * nf;
  return o;
}

function lookAt(eye, center) {
  const z = norm([eye[0] - center[0], eye[1] - center[1], eye[2] - center[2]]);
  const x = norm(cross([0, 1, 0], z));
  const y = cross(z, x);
  const o = new Float32Array(16);
  o[0] = x[0]; o[1] = y[0]; o[2] = z[0];
  o[4] = x[1]; o[5] = y[1]; o[6] = z[1];
  o[8] = x[2]; o[9] = y[2]; o[10] = z[2];
  o[12] = -dot(x, eye); o[13] = -dot(y, eye); o[14] = -dot(z, eye); o[15] = 1;
  return o;
}

function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      o[c * 4 + r] =
        a[r] * b[c * 4] +
        a[4 + r] * b[c * 4 + 1] +
        a[8 + r] * b[c * 4 + 2] +
        a[12 + r] * b[c * 4 + 3];
    }
  }
  return o;
}

function dot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function norm(a) {
  const L = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / L, a[1] / L, a[2] / L];
}

function lightAt(t) {
  const ang = (t / DURATION) * Math.PI * 2;
  return norm([0.55 + 0.38 * Math.sin(ang), 0.78, 0.42 + 0.18 * Math.cos(ang)]);
}

const heron = paintPicture(paintHeron);
const harbor = paintPicture(paintHarbor);
const tiles = buildTiles(heron, harbor);
const plasterCanvas = paintPlaster();
const mesh = cubeMesh();

const gl = canvas.getContext("webgl2", {
  alpha: false,
  antialias: true,
  depth: true,
  preserveDrawingBuffer: true
});

if (!gl) fail("WebGL2 is missing");

const tileProg = gl && program(gl, TILE_VS, TILE_FS);
const plasterProg = gl && program(gl, PLASTER_VS, PLASTER_FS);

let draw = function () {};

if (gl && tileProg && plasterProg) {
  const tileVao = gl.createVertexArray();
  gl.bindVertexArray(tileVao);
  bindAttrib(gl, 0, buffer(gl, mesh.pos), 3, 0);
  bindAttrib(gl, 1, buffer(gl, mesh.nrm), 3, 0);
  bindAttrib(gl, 2, buffer(gl, tiles.home), 2, 1);
  bindAttrib(gl, 3, buffer(gl, tiles.colA), 3, 1);
  bindAttrib(gl, 4, buffer(gl, tiles.colB), 3, 1);
  bindAttrib(gl, 5, buffer(gl, tiles.shape), 4, 1);
  bindAttrib(gl, 6, buffer(gl, tiles.rand), 4, 1);
  bindAttrib(gl, 7, buffer(gl, tiles.edgeB), 1, 1);

  const x0 = -WALL_W / 2;
  const x1 = WALL_W / 2;
  const y0 = WALL_H / 2;
  const y1 = -WALL_H / 2;
  const plasterVerts = new Float32Array([
    x0, y0, 0, 0,
    x1, y0, 1, 0,
    x1, y1, 1, 1,
    x0, y0, 0, 0,
    x1, y1, 1, 1,
    x0, y1, 0, 1
  ]);
  const plasterVao = gl.createVertexArray();
  gl.bindVertexArray(plasterVao);
  const pbuf = buffer(gl, plasterVerts);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, plasterCanvas);

  const uTile = {
    view: gl.getUniformLocation(tileProg, "uViewProj"),
    time: gl.getUniformLocation(tileProg, "uTime"),
    wall: gl.getUniformLocation(tileProg, "uWallW"),
    light: gl.getUniformLocation(tileProg, "uLight"),
    eye: gl.getUniformLocation(tileProg, "uEye")
  };
  const uPlaster = {
    view: gl.getUniformLocation(plasterProg, "uViewProj"),
    tex: gl.getUniformLocation(plasterProg, "uPlaster")
  };

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.50, 0.43, 0.34, 1);

  draw = function render(t) {
    const tt = ((t % DURATION) + DURATION) % DURATION;
    const cam = cameraBlend(tt);
    const eye = [
      lerp(0.46, -0.02, cam),
      lerp(0.5, 0.06, cam),
      lerp(3.15, 4.85, cam)
    ];
    const look = [
      lerp(0.28, 0.02, cam),
      lerp(0.32, -0.08, cam),
      0
    ];
    const view = mul(perspective(18 * Math.PI / 180, W / H, 0.05, 30), lookAt(eye, look));
    const light = lightAt(tt);

    gl.viewport(0, 0, W, H);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.useProgram(plasterProg);
    gl.bindVertexArray(plasterVao);
    gl.uniformMatrix4fv(uPlaster.view, false, view);
    gl.uniform1i(uPlaster.tex, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    gl.useProgram(tileProg);
    gl.bindVertexArray(tileVao);
    gl.uniformMatrix4fv(uTile.view, false, view);
    gl.uniform1f(uTile.time, tt);
    gl.uniform1f(uTile.wall, WALL_W);
    gl.uniform3f(uTile.light, light[0], light[1], light[2]);
    gl.uniform3f(uTile.eye, eye[0], eye[1], eye[2]);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, tiles.count);
  };
}

window.seek = function (t) {
  draw(t);
  return ((t % DURATION) + DURATION) % DURATION;
};

const params = new URLSearchParams(location.search);
if (params.has("t")) {
  window.seek(parseFloat(params.get("t")) || 0);
} else if (!navigator.webdriver) {
  window.seek(0);
  const started = performance.now();
  const tick = (now) => {
    window.seek((now - started) / 1000);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
} else {
  window.seek(0);
}
</script>
</body>
</html>
