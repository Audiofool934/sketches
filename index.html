<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lighthouse sunset</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #14120e;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const DURATION = 6;
const BG = "#14120e";
const INK = "#f3ead7";

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

// Replace frame(). Every mark is a function of t, in seconds, from 0 up to DURATION.
// The picture at 0 and the picture at DURATION are the same picture.
function frame(t) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  const angle = (t / DURATION) * Math.PI * 2;
  const reach = Math.min(w, h) * 0.18;
  const x = w / 2 + Math.cos(angle) * reach;
  const y = h / 2 + Math.sin(angle) * reach;

  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();
}

// The render path calls seek(t) directly. The same t always draws the same pixels.
window.seek = function (t) {
  frame(((t % DURATION) + DURATION) % DURATION);
};

// Live preview only. Under Playwright navigator.webdriver is set, and nothing ticks.
if (!navigator.webdriver) {
  const startedAt = performance.now();
  const tick = (now) => {
    window.seek((now - startedAt) / 1000);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
