<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Road Home - a Middle-earth mosaic</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: grid;
    place-items: center;

    display: block;
    width: min(100vw, 177.7778vh);

</head>

<canvas id="stage" width="1920" height="1080" aria-label="The Road Home, a mosaic journey through Middle-earth"></canvas>
<script type="module" src="engine/main.js"></script>
